name: K8S Project CI

'on':
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      
      - name: Run Ruff Linter
        run: ruff check .

      - name: Check Code Formatting
        run: ruff format --check .

      - name: Run tests
        run: pytest -q

      - name: Build Docker image
        run: docker build --tag cicd-api:${{ github.sha }} .

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: cicd-api:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint Helm chart
        run: helm lint api-helm

      - name: Render Helm chart
        run: helm template api-release api-helm --set image.tag=${{ github.sha }}

  publish-helm:
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Log in to GHCR for Docker image
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push dev image to GHCR
        if: github.ref == 'refs/heads/dev'
        run: |
          docker build --tag ghcr.io/${{ github.repository_owner }}/cicd-api:dev .
          docker push ghcr.io/${{ github.repository_owner }}/cicd-api:dev

      - name: Set chart version
        if: github.ref == 'refs/heads/main'
        run: |
          echo "CHART_VERSION=0.1.0-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Package Helm chart
        if: github.ref == 'refs/heads/main'
        run: |
          helm package api-helm \
            --version "${CHART_VERSION}" \
            --app-version "${GITHUB_SHA}" \
            --destination .helm-packages

      - name: Build Docker image for GHCR on main
        if: github.ref == 'refs/heads/main'
        run: |
          docker build --tag ghcr.io/${{ github.repository_owner }}/cicd-api:${{ github.sha }} .

      - name: Push Docker image to GHCR on main
        if: github.ref == 'refs/heads/main'
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/cicd-api:${{ github.sha }}

      - name: Log in to GHCR for Helm
        if: github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
          helm registry login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Push chart to GHCR
        if: github.ref == 'refs/heads/main'
        run: |
          helm push .helm-packages/api-helm-${CHART_VERSION}.tgz \
            oci://ghcr.io/${{ github.repository_owner }}